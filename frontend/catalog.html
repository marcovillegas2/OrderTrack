<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>OrderTrack Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        OrderTrack
    </div>

    <div class="user-info">

        <span id="user-role"></span>

        <button onclick="logout()" class="logout-btn">
            Cerrar sesión
        </button>

    </div>

</header>

<main class="dashboard">

    <h1 id="dashboard-title">
        Dashboard
    </h1>

    <!-- PANEL OPERADORES -->
    <section id="admin-user-section"
             class="admin-panel">

        <h2>Operadores registrados</h2>

        <input type="text"
               id="operator-username"
               placeholder="Usuario operador">

        <input type="password"
               id="operator-password"
               placeholder="Contraseña">

        <button onclick="createOperator()">
            Crear operador
        </button>

        <ul id="operator-list"></ul>

    </section>

    <!-- PANEL PRODUCTOS -->
    <section id="admin-product-section"
             class="admin-panel">

        <h2>Catálogo de productos</h2>

        <div id="product-admin-controls">
            <input type="text"
                   id="product-name"
                   placeholder="Nombre producto">

            <input type="number"
                   id="product-price"
                   placeholder="Precio">

            <button onclick="createProduct()">
                Crear producto
            </button>
        </div>

        <ul id="product-list"></ul>

    </section>

    <section id="operator-orders-section" class="admin-panel">
        <h2>Pedidos asignados</h2>
        <ul id="operator-order-list"></ul>
    </section>

</main>

<script src="app.js"></script>

</body>
</html>
