<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>OrderTrack Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        OrderTrack
    </div>

    <nav class="admin-menu" id="admin-menu">

        <button
            class="menu-btn"
            onclick="showDashboardSection()">

            Dashboard
        </button>

        <button
            class="menu-btn"
            onclick="showManagementSection()">

            Administración
        </button>

    </nav>

    <div class="user-info">

        <span id="user-role"></span>

        <button onclick="logout()" class="logout-btn">
            Cerrar sesión
        </button>

    </div>

</header>

<main class="dashboard">

    <h1 id="dashboard-title">
        Panel Administrativo
    </h1>

    <div id="dashboard-section">
        <section class="stats-section" id="stats-section">

            <div class="stat-card">
                <h3>Total pedidos</h3>
                <p id="total-orders">0</p>
            </div>

            <div class="stat-card">
                <h3>Pendientes</h3>
                <p id="pending-orders">0</p>
            </div>

            <div class="stat-card">
                <h3>Enviados</h3>
                <p id="sent-orders">0</p>
            </div>

            <div class="stat-card">
                <h3>Entregados</h3>
                <p id="delivered-orders">0</p>
            </div>

            <div class="stat-card">
                <h3>Cancelados</h3>
                <p id="cancelled-orders">0</p>
            </div>

        </section>

        <section class="charts-section" id="charts-section">

            <div class="chart-card">

                <h3>Pedidos por estado</h3>

                <canvas id="ordersPieChart"></canvas>

            </div>

            <div class="chart-card">

                <h3>Resumen general</h3>

                <canvas id="ordersBarChart"></canvas>

            </div>

        </section>
    </div>

    <div id="management-section">
        <!-- PANEL OPERADORES -->
        <section id="admin-user-section" class="admin-panel">

            <h2>Operadores registrados</h2>

            <input type="text"
                   id="operator-username"
                   placeholder="Usuario operador">

            <input type="password"
                   id="operator-password"
                   placeholder="Contraseña">

            <button onclick="createOperator()">
                Crear operador
            </button>

            <ul id="operator-list"></ul>

        </section>

        <!-- PANEL PRODUCTOS -->
        <section id="admin-product-section"
                 class="admin-panel">

            <h2>Catálogo de productos</h2>

            <div id="product-admin-controls">
                <input type="text"
                       id="product-name"
                       placeholder="Nombre producto">

                <input type="number"
                       id="product-price"
                       placeholder="Precio">

                <button onclick="createProduct()">
                    Crear producto
                </button>
            </div>

            <ul id="product-list"></ul>

        </section>
    </div>

    <section id="operator-orders-section" class="admin-panel">
        <h2>Pedidos asignados</h2>
        <ul id="operator-order-list"></ul>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="app.js"></script>

</body>
</html>
